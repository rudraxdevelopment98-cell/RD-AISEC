# Build the RD-AISEC Runner desktop app (runner-gui) for macOS, Windows and Linux
# and publish the installers on a GitHub Release. The portal's "Download the
# desktop app" card links to /releases/latest, so a successful run makes the
# downloads live.
#
# Trigger by pushing a tag like `runner-gui-v1.0.0`. Do NOT hand-create the
# Release first — this workflow creates it. GitHub makes a published release
# immutable (assets can't be added afterwards), so we upload to a DRAFT and then
# publish it, which is the only order that works with immutable releases.
name: Build Runner GUI

on:
  push:
    tags:
      - "runner-gui-v*"
  workflow_dispatch: # builds installers as artifacts (no release without a tag)

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: runner-gui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: runner-gui/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build installers
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # no code-signing certs in CI

      # Collect just the distributable installers (skip electron-builder's
      # unpacked dirs / blockmaps). Uploaded for the release job to gather.
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            runner-gui/dist/*.exe
            runner-gui/dist/*.dmg
            runner-gui/dist/*.zip
            runner-gui/dist/*.AppImage
            runner-gui/dist/*.deb
            runner-gui/dist/*.yml
            runner-gui/dist/*.blockmap
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Gather installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: installers-*
          merge-multiple: true

      - name: List what we're releasing
        run: ls -R dist

      # Create/refresh a DRAFT release with all installers attached. A draft is
      # mutable, so uploads succeed even when immutable releases are enforced.
      - name: Attach installers to a draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: RD-AISEC Runner ${{ github.ref_name }}
          draft: true
          fail_on_unmatched_files: false
          files: dist/*

      # Flip the draft to published (and mark it "latest" so /releases/latest
      # resolves to it). The assets are already baked in from the draft step.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest
